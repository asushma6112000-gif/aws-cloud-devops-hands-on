<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movies Streamers</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white">

    <div
        class="absolute inset-0 bg-cover bg-center"
        style="background-image: url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=2000&q=80');">
    </div>

    <div class="absolute inset-0 bg-gradient-to-r from-black via-black/70 to-transparent"></div>

    <div class="relative z-10 min-h-screen flex flex-col justify-center px-16">

        <h1 class="text-9xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-500">
            MOVIES
        </h1>

        <p class="mt-6 text-xl max-w-xl text-gray-300">
            Blockbusters, classics, and unforgettable stories all in one place.
        </p>

        <div class="mt-10 flex gap-6">

            <button
                class="px-10 py-5 bg-red-500 rounded-lg text-xl font-bold hover:scale-110 transition">
                Watch Movies
            </button>

            <button
                class="px-10 py-5 bg-gray-800 rounded-lg text-xl font-bold hover:scale-110 transition">
                Explore
            </button>

        </div>

    </div>

</body>
</html>
